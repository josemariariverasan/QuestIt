spring:
  application:
    name: ITCareerQuest

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/questit}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false