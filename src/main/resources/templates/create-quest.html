<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>QuestIt - Crear misión</title>
</head>
<body>
<h1 id="form-title">Crear misión</h1>
<a href="/">Volver a misiones</a>
<p id="form-error" role="alert"></p>
<form id="quest-form">
    <fieldset id="quest-fields">
        <legend>Definición de la misión</legend>
        <label for="title">Título</label>
        <input id="title" required maxlength="200" placeholder="Título de la misión...">
        <label for="description">Descripción</label>
        <textarea id="description" placeholder="Descripción..."></textarea>
        <label for="difficulty">Dificultad</label>
        <select id="difficulty">
            <option value="EASY">Fácil</option>
            <option value="MEDIUM">Media</option>
            <option value="HARD">Difícil</option>
            <option value="EPIC">Épica</option>
        </select>
        <label for="xp">Recompensa de XP</label>
        <input id="xp" type="number" required min="0" max="2147483647" step="1" placeholder="XP de la misión...">
        <label for="deadline">Fecha límite (opcional)</label>
        <input id="deadline" type="date">
        <h2>Pasos</h2>
        <div id="steps"></div>
        <button type="button" id="add-step">Añadir paso</button>
        <button type="submit" id="submit-button">Crear misión</button>
    </fieldset>
</form>
<script type="module" src="/js/quest-form.js"></script>
</body>
</html>
