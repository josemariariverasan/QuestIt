<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuestIt</title>
</head>
<body>

<h1>QuestIt</h1>
<p>Donde tus tareas se hacen misiones</p>

<button onclick="mostrarMisiones()">Explorar misiones</button>

<a href="/create-quest">Crear misión</a>

<div id="mission-index" style="display: none;">
    <h2>Índice de misiones</h2>

    <div id="missions">
    </div>
</div>

<script>

    function mostrarMisiones() {

        let indice = document.getElementById("mission-index");

        indice.style.display = "block";

        let contenedor = document.getElementById("missions");

        contenedor.innerHTML = "";

        let missions = JSON.parse(localStorage.getItem("missions")) || [];

        for (let mission of missions) {

            let missionElement = document.createElement("p");

            missionElement.textContent = mission.title;

            contenedor.appendChild(missionElement);
        }
    }contenedor.appendChild(missionElement);


</script>

</body>
</html>
